name: Build Docker Image with Args

on:
  workflow_call:
    inputs:
      docker_registry:
        description: "The Docker Registry to use"
        required: true
        type: string
      docker_image_name:
        description: "The Docker Container Name to use."
        required: true
        type: string
      #
      docker_file_name:
        description: "The Dockerfile filename to use, relative to the repo root."
        required: false
        type: string
        default: "Dockerfile"
      #
      deploy_environment:
        description: "The Deploy Environment that should be passed to Docker during Build Phase. If not provided, it will be automagically determined based on branch name."
        required: false
        type: string
        default: ""
      build_id:
        description: "The Build ID that should be passed to Docker during Build Phase."
        required: true
        type: string
    outputs:
      tagless_image_url:
        description: 'The "tagless" Docker image URL. So would be "{docker_registry}{docker_image_name}:{deploy_environment}"'
        value: ${{ jobs.build_and_publish.outputs.tagless_image_url }}
      tagged_image_url:
        description: 'The "full" Docker image URL. So would be "{docker_registry}{docker_image_name}:{deploy_environment}-{build_id}"'
        value: ${{ jobs.build_and_publish.outputs.tagged_image_url }}
    secrets:
      DOCKER_REGISTRY_USERNAME:
        required: true
      DOCKER_REGISTRY_PASSWORD:
        required: true

env:
  DOCKER_BUILDKIT: 1

jobs:
  build_and_publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    outputs:
      tagless_image_url: ${{ steps.build_strs.outputs.tagless_img_url }}
      tagged_image_url: ${{ steps.build_strs.outputs.tagged_img_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate Build Strings & Cache Config
        id: build_strs
        run: |
          lowercase_env=$(echo "${{ inputs.deploy_environment }}" | tr '[:upper:]' '[:lower:]')
          echo "lowercase_env=${lowercase_env}" >> $GITHUB_OUTPUT

          # Ensure slash separation between registry and image name if needed
          REGISTRY_URL="${{ inputs.docker_registry }}"
          [[ "${REGISTRY_URL}" != */ ]] && REGISTRY_URL="${REGISTRY_URL}/"

          tagless_image_base="${REGISTRY_URL}${{ inputs.docker_image_name }}:${lowercase_env}"
          echo "tagless_img_url=${tagless_image_base}" >> $GITHUB_OUTPUT
          echo "tagged_img_name=${tagless_image_base}-${{ inputs.build_id }}" >> $GITHUB_OUTPUT

          # 1. Current branch cache
          safe_branch=$(echo "${{ github.ref_name }}" | tr '/' '-')
          CACHE_BRANCH_REF="${tagless_image_base}-buildcache-${safe_branch}"
          echo "cache_image_ref=${CACHE_BRANCH_REF}" >> $GITHUB_OUTPUT

          # 2. Base cache-from sources
          CACHE_FROM="type=registry,ref=${CACHE_BRANCH_REF}"

          # Add PR target base branch (e.g. master/main) to cache-from if building a PR
          if [ -n "${{ github.base_ref }}" ]; then
            safe_base=$(echo "${{ github.base_ref }}" | tr '/' '-')
            CACHE_FROM="${CACHE_FROM}
          type=registry,ref=${tagless_image_base}-buildcache-${safe_base}"
          fi

          # Add repository default branch fallback cache (avoids hardcoding 'develop' or 'main')
          default_branch="${{ github.event.repository.default_branch }}"
          if [ -n "${default_branch}" ] && [ "${default_branch}" != "${{ github.ref_name }}" ]; then
            safe_default=$(echo "${default_branch}" | tr '/' '-')
            CACHE_FROM="${CACHE_FROM}
          type=registry,ref=${tagless_image_base}-buildcache-${safe_default}"
          fi

          # Generic env fallback
          CACHE_FROM="${CACHE_FROM}
          type=registry,ref=${tagless_image_base}-buildcache"

          # Export multiline CACHE_FROM
          {
            echo "cache_from<<EOF"
            echo "${CACHE_FROM}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Cache-to: Only export to this branch (mode=max so intermediate layers are cached)
          # Only update the generic fallback cache if building on the repo default branch
          if [ "${{ github.ref_name }}" = "${default_branch}" ]; then
            {
              echo "cache_to<<EOF"
              echo "type=registry,mode=max,ref=${CACHE_BRANCH_REF}"
              echo "type=registry,mode=max,ref=${tagless_image_base}-buildcache"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "cache_to=type=registry,mode=max,ref=${CACHE_BRANCH_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Print Deploy Info
        run: |
          echo "Building ${{ steps.build_strs.outputs.tagged_img_name }}"
          echo "Cache To: ${{ steps.build_strs.outputs.cache_to }}"

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.docker_registry }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.docker_file_name }}
          push: true
          cache-from: ${{ steps.build_strs.outputs.cache_from }}
          cache-to: ${{ steps.build_strs.outputs.cache_to }}
          tags: ${{ steps.build_strs.outputs.tagged_img_name }}
          build-args: |
            DEPLOY_ENV=${{ inputs.deploy_environment }}
            BUILD_ID=${{ inputs.build_id }}
