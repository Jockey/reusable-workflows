name: Build Docker Image with Args

on:
  workflow_call:
    inputs:
      docker_registry:
        description: "The Docker Registry to use"
        required: true
        type: string
      docker_container_name:
        description: "The Docker Container Name to use."
        required: true
        type: string
      docker_container_tag:
        description: "The Docker Container Tag to use."
        required: true
        type: string
      #
      docker_file_name:
        description: "The Dockerfile filename to use, relative to the repo root."
        required: false
        type: string
        default: "Dockerfile"
      #
      deploy_environment:
        description: "The Deploy Environment that should be passed to Docker during Build Phase."
        required: false
        type: string
        default: ""
      branch_environment_map:
        description: "If provided, extracts the current Github Branch name from the provided JSON object"
        required: false
        type: string
        default: ""
      build_id:
        description: "The Build ID that should be passed to Docker during Build Phase."
        required: true
        type: string
      fallback_branch:
        description: "Optional fallback branch for cache if different from the repo default branch."
        required: false
        type: string
        default: ""
    outputs:
      docker_image_name:
        description: "Fully qualified Docker Image name. Like '{registry}/{container-name}:{tag}'"
        # Compiled "inline" to prevent .env casting
        value: ${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}:${{ inputs.docker_container_tag }}

env:
  DOCKER_BUILDKIT: 1

jobs:
  build_and_publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    env:
      CONTAINER_FQN: ${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}:${{ inputs.docker_container_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout helper scripts
        uses: actions/checkout@v6
        with:
          repository: Jockey/reusable-workflows
          ref: master
          sparse-checkout: |
            scripts/bash/extract-value-from-map.sh
          sparse-checkout-cone-mode: false
          path: .reusable-workflows

      - name: Determine Deploy Env
        run: |
          chmod +x ./.reusable-workflows/scripts/bash/extract-value-from-map.sh
          echo "DEPLOY_ENV=$(./.reusable-workflows/scripts/bash/extract-value-from-map.sh -k '${{ github.base_ref || github.ref_name }}' -m '${{ inputs.branch_environment_map }}' -d '${{ inputs.deploy_environment }}')" >> $GITHUB_ENV

      - name: Check Deploy Env
        run: |
          if [ -z "${{ env.DEPLOY_ENV }}" ] || [ "${{ env.DEPLOY_ENV }}" = "null" ]; then
            echo "Error: DEPLOY_ENV is empty or 'null'. Exiting."
            exit 1
          else
            echo "DEPLOY_ENV is: '${{ env.DEPLOY_ENV }}'"
          fi

      - name: Compute Cache Refs
        # Docker tags can't contain "/", but github.ref_name will contain
        # one for any branch with a slash in its name (e.g. "feature/foo").
        #
        # Cache is scoped per-branch to avoid different branches causing
        # thrashing by overwriting the same cache. Falls back to the
        # develop-branch cache below via an extra `cache-from` entry.
        run: |
          REGISTRY_IMAGE="${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}"
          
          # 1. Current branch cache (used for cache-to and first cache-from)
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          CACHE_IMAGE_REF="${REGISTRY_IMAGE}:buildcache-${SAFE_BRANCH}"
          echo "CACHE_IMAGE_REF=${CACHE_IMAGE_REF}" >> $GITHUB_ENV

          # Start constructing CACHE_FROM list
          CACHE_FROM="type=registry,ref=${CACHE_IMAGE_REF}"

          # 2. PR Target Base Branch (e.g. master, main, or release branch)
          if [ -n "${{ github.base_ref }}" ]; then
            SAFE_BASE=$(echo "${{ github.base_ref }}" | tr '/' '-')
            CACHE_FROM="${CACHE_FROM}
          type=registry,ref=${REGISTRY_IMAGE}:buildcache-${SAFE_BASE}"
          fi

          # 3. Fallback to Repo Default Branch (or inputs.fallback_branch if supplied)
          DEFAULT_BRANCH="${{ inputs.fallback_branch || github.event.repository.default_branch }}"
          if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "${{ github.ref_name }}" ] && [ "$DEFAULT_BRANCH" != "${{ github.base_ref }}" ]; then
            SAFE_DEFAULT=$(echo "${DEFAULT_BRANCH}" | tr '/' '-')
            CACHE_FROM="${CACHE_FROM}
          type=registry,ref=${REGISTRY_IMAGE}:buildcache-${SAFE_DEFAULT}"
          fi

          # Export multiline CACHE_FROM to GITHUB_ENV
          {
            echo "CACHE_FROM<<EOF"
            echo "${CACHE_FROM}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.docker_registry }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.docker_file_name }}
          push: true
          cache-from: ${{ env.CACHE_FROM }}
          # Export to a single registry tag
          cache-to: type=registry,mode=max,ref=${{ env.CACHE_IMAGE_REF }}
          tags: ${{ env.CONTAINER_FQN }}
          build-args: |
            DEPLOY_ENV=${{ env.DEPLOY_ENV }}
            BUILD_ID=${{ inputs.build_id }}
