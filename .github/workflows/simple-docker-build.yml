name: Docker Image Build

# Differs from `docker-build-with-args.yml`, as this workflow
# does not do any "environment" logic.
#
# This should be used when a singular Docker Image build
# could be deployed to different environments.

on:
    workflow_call:
        inputs:
            docker_registry:
                description: "The Docker Registry to use"
                required: true
                type: string
            docker_container_name:
                description: "The Docker Container Name to use."
                required: true
                type: string
            docker_container_tag:
                description: "The Docker Container Tag to use."
                required: true
                type: string
            #
            docker_file_name:
                description: "The Dockerfile filename to use, relative to the repo root."
                required: false
                type: string
                default: "Dockerfile"
            #
            build_id:
                description: "The Build ID that should be passed to Docker during Build Phase."
                required: true
                type: string
            fallback_branch:
                description: "Optional fallback branch for cache if different from the repo default branch."
                required: false
                type: string
                default: ""
        outputs:
            docker_image_name:
                description: "Fully qualified Docker Image name. Like '{registry}/{container-name}:{tag}'"
                value: ${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}:${{ inputs.docker_container_tag }}

env:
    DOCKER_BUILDKIT: 1

jobs:
    build_and_publish:
        name: Docker Build & Publish
        runs-on: ubuntu-latest
        env:
            CONTAINER_FQN: ${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}:${{ inputs.docker_container_tag }}
        steps:
            - uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ inputs.docker_registry }}
                  username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
                  password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

            - name: Compute Cache Configuration
              id: cache_config
              run: |
                  REGISTRY_IMAGE="${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}"

                  # 1. Sanitize current branch name for Docker tag
                  SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
                  CACHE_BRANCH_REF="${REGISTRY_IMAGE}:buildcache-${SAFE_BRANCH}"
                  CACHE_DEFAULT_FALLBACK="${REGISTRY_IMAGE}:buildcache"

                  # Start CACHE_FROM list with current branch cache
                  CACHE_FROM="type=registry,ref=${CACHE_BRANCH_REF}"

                  # 2. Add PR target base branch (e.g. master or main)
                  if [ -n "${{ github.base_ref }}" ]; then
                      SAFE_BASE=$(echo "${{ github.base_ref }}" | tr '/' '-')
                      CACHE_FROM="${CACHE_FROM}
                  type=registry,ref=${REGISTRY_IMAGE}:buildcache-${SAFE_BASE}"
                  fi

                  # 3. Add repo default branch fallback (dynamically resolved)
                  DEFAULT_BRANCH="${{ inputs.fallback_branch || github.event.repository.default_branch }}"
                  if [ -n "${DEFAULT_BRANCH}" ] && [ "${DEFAULT_BRANCH}" != "${{ github.ref_name }}" ] && [ "${DEFAULT_BRANCH}" != "${{ github.base_ref }}" ]; then
                      SAFE_DEFAULT=$(echo "${DEFAULT_BRANCH}" | tr '/' '-')
                      CACHE_FROM="${CACHE_FROM}
                  type=registry,ref=${REGISTRY_IMAGE}:buildcache-${SAFE_DEFAULT}"
                  fi

                  # 4. Add generic fallback tag
                  CACHE_FROM="${CACHE_FROM}
                  type=registry,ref=${CACHE_DEFAULT_FALLBACK}"

                  # Export multiline CACHE_FROM
                  {
                      echo "cache_from<<EOF"
                      echo "${CACHE_FROM}"
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

                  # Cache-to: Export using mode=max so all intermediate layers are cached in ACR
                  # If building on the default branch, also refresh the generic fallback tag
                  if [ "${{ github.ref_name }}" = "${DEFAULT_BRANCH}" ]; then
                      {
                          echo "cache_to<<EOF"
                          echo "type=registry,mode=max,ref=${CACHE_BRANCH_REF}"
                          echo "type=registry,mode=max,ref=${CACHE_DEFAULT_FALLBACK}"
                          echo "EOF"
                      } >> "$GITHUB_OUTPUT"
                  else
                      echo "cache_to=type=registry,mode=max,ref=${CACHE_BRANCH_REF}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build & Push Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ inputs.docker_file_name }}
                  push: true
                  tags: ${{ env.CONTAINER_FQN }}
                  cache-from: ${{ steps.cache_config.outputs.cache_from }}
                  cache-to: ${{ steps.cache_config.outputs.cache_to }}
                  build-args: |
                      BUILD_ID=${{ inputs.build_id }}
