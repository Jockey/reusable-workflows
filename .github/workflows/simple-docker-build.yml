name: Docker Image Build

# Differs from `docker-build-with-args.yml`, as this workflow
# does not do any "environment" logic.
#
# This should be used when a singular Docker Image build
# could be deployed to different environments.

on:
    workflow_call:
        inputs:
            docker_registry:
                description: "The Docker Registry to use"
                required: true
                type: string
            docker_container_name:
                description: "The Docker Container Name to use."
                required: true
                type: string
            docker_container_tag:
                description: "The Docker Container Tag to use."
                required: true
                type: string
            #
            docker_file_name:
                description: "The Dockerfile filename to use, relative to the repo root."
                required: false
                type: string
                default: "Dockerfile"
            #
            build_id:
                description: "The Build ID that should be passed to Docker during Build Phase."
                required: true
                type: string
        #
        outputs:
            docker_image_name:
                description: "Fully qualified Docker Image name. Like '{registry}/{container-name}:{tag}'"
                # Compiled "inline" to prevent .env casting
                value: ${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}:${{ inputs.docker_container_tag }}

env:
    DOCKER_BUILDKIT: 1

jobs:
    build_and_publish:
        name: Docker Build & Publish
        runs-on: ubuntu-latest
        env:
            CONTAINER_FQN: ${{ inputs.docker_registry }}/${{ inputs.docker_container_name }}:${{ inputs.docker_container_tag }}
        steps:
            # This checks out the repository so your workflow operates from root of repository
            - uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ inputs.docker_registry }}
                  username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
                  password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

            - name: Build & Push Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ inputs.docker_file_name }}
                  push: true
                  tags: ${{ env.CONTAINER_FQN }}
                  # Look for existing cache in GitHub Actions storage
                  cache-from: type=gha
                  # Write new cache layers back to GitHub Actions storage (mode=max caches all stages)
                  cache-to: type=gha,mode=max
                  build-args: |
                      BUILD_ID=${{ inputs.build_id }}
